name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Run API tests
        run: python -m unittest discover -s tests -v

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          files = list(Path(".").glob("*.html"))
          for path in files:
              text = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", text, flags=re.S | re.I)
              for index, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                      f.write(script)
                      temp = f.name
                  try:
                      subprocess.run(["node", "--check", temp], check=True)
                  except subprocess.CalledProcessError:
                      raise SystemExit(f"JavaScript syntax error in {path} (script #{index})")
          print(f"Validated {len(files)} HTML files.")
          PY
